services:
  ppe-monitor:
    build:
      context: .
      args:
        TORCH_INDEX: ${TORCH_INDEX:-cpu}
        # the container runs as this user: run `sudo chown -R <uid>:<gid> config data videos models` once
        APP_UID: ${PPE_UID:-1000}
        APP_GID: ${PPE_GID:-1000}
        # shown in the footer and on System health: GIT_COMMIT=$(git rev-parse --short HEAD) docker compose up -d --build
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: ppe-monitor:latest
    ports:
      - "${PPE_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false          # needs Docker Compose >= 2.24
    environment:
      PPE_DEVICE: ${PPE_DEVICE:-auto}
      PPE_CONFIG: /app/config/config.yaml       # edited from the Config page
      # violations + users + refresh sessions + audit log + analytics counters: one SQLite file
      PPE_DB_PATH: /app/data/violations.db
      # signs the access tokens; must be set in .env (compose refuses to start without it)
      PPE_JWT_SECRET: ${PPE_JWT_SECRET:?set PPE_JWT_SECRET in .env - see .env.example}
      # set to true once the dashboard is served over HTTPS (reverse proxy), so the sign-in cookie never travels in clear
      PPE_COOKIE_SECURE: ${PPE_COOKIE_SECURE:-auto}
      # plant time zone: "violations today" and the CSV local_time column use it (e.g. Asia/Kolkata)
      TZ: ${TZ:-UTC}
      # the name people see in the footer and on System health (a container's own host name is a random id)
      PPE_SERVER_NAME: ${PPE_SERVER_NAME:-}
      # application log kept on disk (rotated, 10 x 10 MB) so it survives `docker compose down` / rebuilds
      PPE_LOG_DIR: /app/logs
    volumes:
      - ./videos:/app/videos                    # camera clips / NVR exports (writable: Add camera > Upload saves here)
      - ./models:/app/models                    # weights (+ cached OpenVINO export)
      - ./config:/app/config                    # config.yaml + config.backup.<timestamp>.yaml (persistent)
      - ./logs:/app/logs                        # ppe-monitor.log (rotated): survives container recreation
      - ./data:/app/data                        # violations.db: violations, users, audit log (persistent)
    restart: unless-stopped
    stop_grace_period: 15s

    # cap CPU so the (CPU-only) inference pipeline can't starve the host; override via .env
    cpus: ${PPE_CPUS:-4}

    # --- Intel iGPU (OpenVINO GPU plugin): uncomment on a Linux host with /dev/dri ---
    # devices:
    #   - /dev/dri:/dev/dri

    # --- NVIDIA GPU: add docker-compose.gpu.yml (see that file) and build with TORCH_INDEX=cu124 ---
